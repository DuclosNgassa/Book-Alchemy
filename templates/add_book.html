<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Add Book - Book Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container form-page-container">
    <!-- Header Section -->
    <header class="library-header">
        <h1>📚 Add a New Book</h1>
        <a href="{{ url_for('home') }}" class="btn btn-secondary">← Back to Library</a>
    </header>

    <!-- Display the success message if it exists -->
    {% if success_message %}
        <div class="alert alert-success">
            {{ success_message }}
        </div>
    {% endif %}

    <!-- Form Card Container -->
    <div class="form-card">
        <form action="/add_book" method="POST" class="styled-form">

            <div class="form-group">
                <label for="title">Book Title:</label>
                <input type="text" id="title" name="title" placeholder="Enter book title" required>
            </div>

            <div class="form-group">
                <label for="isbn">ISBN:</label>
                <input type="text" id="isbn" name="isbn" placeholder="e.g. 9780132350884" required>
            </div>

            <div class="form-group">
                <label for="publication_year">Publication Date:</label>
                <input type="date" id="publication_year" name="publication_year" required>
            </div>
            <div class="form-group">
                <label for="rating">Rating (1 - 10):</label>
                <input type="number" id="rating" name="rating" min="1" max="10" placeholder="e.g. 8">
            </div>
            <div class="form-group">
                <label for="author_id">Author:</label>
                <select id="author_id" name="author_id" required>
                    <option value="" disabled selected>Select an Author</option>
                    {% for author in authors %}
                        <option value="{{ author.id }}">{{ author.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Book</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
