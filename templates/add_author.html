<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Add Author - Book Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container form-page-container">
    <!-- Header Section -->
    <header class="library-header">
        <div>
            <h1>✍️ Add a New Author</h1>
            <p style="color: #64748b; font-size: 0.95rem; margin-top: 4px;">Expand your library's author directory</p>
        </div>
        <a href="{{ url_for('home') }}" class="btn btn-secondary">← Back to Library</a>
    </header>

    <!-- Display the success message if it exists -->
    {% if success_message %}
        <div class="alert alert-success">
            ✨ {{ success_message }}
        </div>
    {% endif %}

    <!-- Form Card Container -->
    <div class="form-card">
        <form action="{{ url_for('add_author') }}" method="POST" class="styled-form">

            <div class="form-group">
                <label for="name">Author Full Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. Jane Austen" required>
            </div>

            <div class="form-group">
                <label for="birth_date">Birth Date</label>
                <input type="date" id="birth_date" name="birth_date" required>
            </div>

            <div class="form-group">
                <label for="date_of_death">Date of Death <span
                        style="font-weight: normal; color: #94a3b8;">(Optional)</span></label>
                <input type="date" id="date_of_death" name="date_of_death">
                <small style="color: #64748b; font-size: 0.85rem; margin-top: 2px;">Leave blank if the author is
                    currently alive.</small>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Author</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
