<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Home - Book Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>

    <h1>Welcome to the Book Library</h1>
    <!-- Sorting Dropdown Form -->
    <div class="sort-container" style="margin-bottom: 20px;">
      <form method="GET" action="{{ url_for('home') }}">
        <label for="sort">Sort books by:</label>
        <select name="sort" id="sort">
          <option value="title" {% if current_sort == 'title' %}selected{% endif %}>Title</option>
          <option value="publication_year" {% if current_sort == 'publication_year' %}selected{% endif %}>Publication year</option>
          <option value="author" {% if current_sort == 'author' %}selected{% endif %}>Author Name</option>
        </select>
      <button type="submit">Sort</button>
      </form>
    </div>

    <!-- Book listing -->
    {% for book in books %}
      <div class="book-card">
        <!-- Book Cover Image using Open Library API -->
        <img class="book-cover"
             src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-M.jpg"
             alt="{{ book.title }} cover">

        <div>
          <h3>{{ book.title }}</h3>
          <p>By: <strong>{{ book.author.name }}</strong></p>
          <p>Published: {{ book.publication_year.strftime('%Y') }}</p>
        </div>
      </div>
    {% endfor %}

  </body>
</html>
