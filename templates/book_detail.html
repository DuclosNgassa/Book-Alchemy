<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.title }} - Book Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container detail-page-container">
    <header class="library-header">
        <h1>📖 Book Details</h1>
        <a href="{{ url_for('home') }}" class="btn btn-secondary">← Back to Library</a>
    </header>

    <div class="detail-card">
        <div class="detail-image-wrapper">
            <img class="book-cover-large"
                 src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-L.jpg"
                 alt="{{ book.title }} cover"
                 onerror="this.src='https://via.placeholder.com/200x300?text=No+Cover'">
        </div>

        <div class="detail-info">
            <h2>{{ book.title }}</h2>
            <p class="detail-meta"><strong>Author:</strong>
                <a href="{{ url_for('author_detail', author_id=book.author.id) }}">{{ book.author.name }}</a>
            </p>
            <p class="detail-meta"><strong>ISBN:</strong> {{ book.isbn }}</p>
            <p class="detail-meta"><strong>Publication Date:</strong> {{ book.publication_year.strftime('%B %d, %Y') }}
            </p>

            {% if book.rating %}
                <p class="detail-meta" style="color: #f59e0b; font-weight: bold;">⭐ Rating: {{ book.rating }} / 10</p>
            {% endif %}

            <div class="detail-actions" style="margin-top: 20px;">
                <form action="{{ url_for('delete_book', book_id=book.id) }}" method="POST"
                      onsubmit="return confirm('Are you sure you want to delete this book?');">
                    <button type="submit" class="btn btn-danger">Delete Book</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
